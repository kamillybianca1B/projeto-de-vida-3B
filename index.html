<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meus objetivos do ano</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Poppins", Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #ffd6e8, #ffeef7, #ffcce0);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* Corações decorativos */
        body::before,
        body::after {
            content: "❤ ✿ ♡ ✿ ❤";
            position: absolute;
            font-size: 30px;
            color: rgba(255, 105, 180, 0.2);
        }

        body::before {
            top: 20px;
            left: 30px;
        }

        body::after {
            bottom: 20px;
            right: 30px;
        }

        .conteudo-principal {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 30px;
            box-shadow: 0 15px 35px rgba(255, 105, 180, 0.3);
            width: 90%;
            max-width: 700px;
            text-align: center;
            border: 3px solid #ffb6d9;
        }

        .titulo-principal {
            color: #ff4f9d;
            font-size: 2.4rem;
            margin-bottom: 30px;
        }

        .titulo-principal span {
            color: #ff89c2;
        }

        .botoes {
            display: grid;
            gap: 18px;
        }

        .botao {
            background: linear-gradient(135deg, #ff8fc4, #ffb6d9);
            color: white;
            border: none;
            padding: 18px;
            border-radius: 20px;
            font-size: 1.1rem;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 8px 15px rgba(255, 105, 180, 0.25);
        }

        .botao:hover {
            transform: translateY(-5px) scale(1.03);
            background: linear-gradient(135deg, #ff69b4, #ff9fcf);
            box-shadow: 0 12px 20px rgba(255, 105, 180, 0.35);
        }

        .botao:active {
            transform: scale(0.97);
        }
    </style>
</head>

<body>
    <section class="conteudo-principal">
        <h2 class="titulo-principal">Meus Objetivos do ano<span>_</span></h2>

        <div class="botoes">
            <button class="botao">Cursos na Alura</button>
            <button class="botao">Criar projetos em Javascript</button>
            <button class="botao">Criar um portfolio</button>
            <button class="botao">Atualizar meu currículo</button>
        </div>
    </section>
</body>

</html>
