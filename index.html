<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>✨ Meus Objetivos ✨</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,Arial,sans-serif;
}

body{

background:linear-gradient(-45deg,#ffd6e8,#ffc2dc,#ffe8f3,#ffc8df);
background-size:400% 400%;
animation:fundo 12s ease infinite;

display:flex;
justify-content:center;
align-items:center;

min-height:100vh;

overflow:hidden;

}

@keyframes fundo{

0%{
background-position:0% 50%;
}

50%{
background-position:100% 50%;
}

100%{
background-position:0% 50%;
}

}

/* Corações */

.coracoes{

position:fixed;
width:100%;
height:100%;
overflow:hidden;
pointer-events:none;

}

.coracao{

position:absolute;
bottom:-40px;
font-size:22px;
color:rgba(255,255,255,.7);

animation:subir linear forwards;

}

@keyframes subir{

0%{

transform:translateY(0) rotate(0deg);
opacity:0;

}

20%{

opacity:1;

}

100%{

transform:translateY(-120vh) rotate(360deg);
opacity:0;

}

}

/* Caixa principal */

.container{

width:90%;
max-width:900px;

padding:35px;

background:rgba(255,255,255,.35);

backdrop-filter:blur(15px);

border-radius:30px;

box-shadow:0 20px 45px rgba(255,105,180,.25);

animation:entrada 1s;

}

@keyframes entrada{

from{

opacity:0;
transform:translateY(40px);

}

to{

opacity:1;
transform:translateY(0);

}

}

h1{

text-align:center;
color:#ff2f86;

font-size:42px;

margin-bottom:10px;

}

.sub{

text-align:center;

color:#555;

margin-bottom:35px;

}

/* Botão modo escuro */

#tema{

position:fixed;

top:20px;

right:20px;

width:55px;

height:55px;

border:none;

border-radius:50%;

font-size:24px;

cursor:pointer;

background:white;

box-shadow:0 8px 20px rgba(0,0,0,.15);

transition:.4s;

}

#tema:hover{

transform:rotate(180deg) scale(1.1);

}

/* Cards */

.cards{

display:grid;

grid-template-columns:repeat(auto-fit,minmax(200px,1fr));

gap:20px;

}

.card{

background:white;

padding:25px;

border-radius:25px;

cursor:pointer;

transition:.35s;

text-align:center;

box-shadow:0 10px 25px rgba(255,105,180,.15);

animation:aparecer .8s backwards;

}

.card:nth-child(2){

animation-delay:.2s;

}

.card:nth-child(3){

animation-delay:.4s;

}

.card:nth-child(4){

animation-delay:.6s;

}

@keyframes aparecer{

from{

opacity:0;
transform:translateY(30px);

}

to{

opacity:1;
transform:translateY(0);

}

}

.card:hover{

transform:translateY(-10px) scale(1.05);

box-shadow:0 20px 35px rgba(255,20,147,.3);

}

.emoji{

font-size:55px;

margin-bottom:15px;

}

.card h2{

color:#ff2f86;

margin-bottom:10px;

}

.card p{

color:#666;

}

/* Caixa das respostas */

#resposta{

margin-top:35px;

background:white;

padding:25px;

border-radius:25px;

display:none;

animation:mostrar .5s;

box-shadow:0 15px 30px rgba(255,105,180,.2);

}

@keyframes mostrar{

from{

opacity:0;

transform:scale(.8);

}

to{

opacity:1;

transform:scale(1);

}

}

#titulo{

color:#ff2f86;

margin-bottom:10px;

}

#texto{

color:#555;

line-height:1.7;

}

</style>

</head>

<body>

<div class="coracoes"></div>

<button id="tema">

🌙

</button>

<div class="container">

<h1>

✨ Meus Objetivos ✨

</h1>

<p class="sub">

Pequenos passos hoje.
Grandes conquistas amanhã.

</p>

<div class="cards">

<div class="card" onclick="mostrar('escola')">

<div class="emoji">

🏫

</div>

<h2>

Escola

</h2>

<p>

Passar de ano

</p>

</div>

<div class="card" onclick="mostrar('dinheiro')">

<div class="emoji">

💰

</div>

<h2>

Dinheiro

</h2>

<p>

Comprar uma moto

</p>

</div>

<div class="card" onclick="mostrar('estudos')">

<div class="emoji">

📚

</div>

<h2>

Estudos

</h2>

<p>

ENEM e Faculdade

</p>

</div>

<div class="card" onclick="mostrar('futuro')">

<div class="emoji">

💼

</div>

<h2>

Futuro

</h2>

<p>

Conseguir um bom emprego

</p>

</div>

</div>

<div id="resposta">

<h2 id="titulo"></h2>

<p id="texto"></p>

</div>
<script>

const resposta = document.getElementById("resposta");
const titulo = document.getElementById("titulo");
const texto = document.getElementById("texto");

function mostrar(tipo){

    resposta.style.display="block";

    switch(tipo){

        case "escola":

            titulo.innerHTML="🏫 Escola";

            texto.innerHTML=
            "<strong>Objetivo:</strong> Passar de ano.<br><br>😂 A recuperação vai procurar meu nome e não vai encontrar!";

        break;

        case "dinheiro":

            titulo.innerHTML="💰 Dinheiro";

            texto.innerHTML=
            "<strong>Objetivo:</strong> Juntar dinheiro para comprar minha moto. 🏍️<br><br>Todo real economizado me deixa mais perto dela!";

        break;

        case "estudos":

            titulo.innerHTML="📚 Estudos";

            texto.innerHTML=
            "<strong>Objetivo:</strong> Passar no ENEM e entrar na faculdade. 🎓<br><br>O esforço de hoje será o orgulho de amanhã!";

        break;

        case "futuro":

            titulo.innerHTML="💼 Futuro";

            texto.innerHTML=
            "<strong>Objetivo:</strong> Conseguir um ótimo emprego.<br><br>🚀 Grandes oportunidades começam com pequenos passos.";

        break;

    }

    resposta.scrollIntoView({
        behavior:"smooth"
    });

}

/* ===========================
   MODO ESCURO
=========================== */

const tema=document.getElementById("tema");

tema.onclick=function(){

    document.body.classList.toggle("dark");

    if(document.body.classList.contains("dark")){

        tema.innerHTML="☀️";

    }else{

        tema.innerHTML="🌙";

    }

}

/* ===========================
   CORAÇÕES
=========================== */

function criarCoracao(){

    const coracao=document.createElement("div");

    coracao.className="coracao";

    coracao.innerHTML="❤";

    coracao.style.left=Math.random()*100+"vw";

    coracao.style.fontSize=(15+Math.random()*20)+"px";

    coracao.style.animationDuration=(5+Math.random()*4)+"s";

    document.querySelector(".coracoes").appendChild(coracao);

    setTimeout(function(){

        coracao.remove();

    },9000);

}

setInterval(criarCoracao,500);

</script>

<style>

.dark{

background:linear-gradient(135deg,#1e1e1e,#2d2d2d,#111);

}

.dark .container{

background:rgba(40,40,40,.8);

color:white;

}

.dark .card{

background:#303030;

color:white;

}

.dark .card h2{

color:#ff89c7;

}

.dark .card p{

color:#ddd;

}

.dark .sub{

color:#ddd;

}

.dark #resposta{

background:#303030;

color:white;

}

.dark #titulo{

color:#ff89c7;

}

.dark #texto{

color:#eee;

}

</style>

</body>
</html>
